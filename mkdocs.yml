site_name: ECO 412 | Behavioral Economics Lab
site_description: Interactive behavioral economics laboratories for ECO 412
site_author: Zachary A. Smith
site_url: https://Prof-Smith.github.io/ECO412/
repo_name: Prof-Smith/ECO412
repo_url: https://github.com/Prof-Smith/ECO412

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md

  - Module 1:
      - Overview: module-1/index.md
      - Interactive Lab: module-1/lab.md
      - Student Guide: module-1/student-guide.md
      - Instructor Guide: module-1/instructor-guide.md
      - Case Study: module-1/case-study.md
      - Rubric: module-1/rubric.md

  - Module 2:
      - Overview: module-2/index.md
      - Research Design Lab: module-2/lab.md
      - Student Guide: module-2/student-guide.md
      - Instructor Guide: module-2/instructor-guide.md
      - Case Study: module-2/case-study.md
      - Rubric: module-2/rubric.md

  - Module 3:
      - Overview: module-3/index.md
      - Utility Journey Lab: module-3/lab.md
      - Value Construction Lab: module-3/value-construction.md
      - Student Guide: module-3/student-guide.md
      - Instructor Guide: module-3/instructor-guide.md
      - Case Study: module-3/case-study.md
      - Rubric: module-3/rubric.md

  - Field Studies:
      - Overview: field-studies/index.md
      - Module 1 Field Study: field-studies/module-1.md
      - Module 2 Field Study: field-studies/module-2.md
      - Module 3 Field Study: field-studies/module-3.md

    - Adaptive Species Lens:
      - Overview: adaptive-species/index.md
      - Decision Journal: adaptive-species/decision-journal.md

  - Class Research Hub: research-hub/index.md

extra_css:
  - assets/css/extra.css
  - assets/css/print.css
  - assets/css/module2.css
  - assets/css/module3.css
  - assets/css/world-class.css
  - assets/css/analysis-upgrade.css
  - assets/css/site-polish.css
  - assets/css/experience-v2.css
  - assets/css/field-studies.css
  - assets/css/field-study-integration.css
  - assets/js/adaptive-species.js

extra_javascript:
  - https://cdn.plot.ly/plotly-2.35.2.min.js
  - assets/js/lab-core.js
  - assets/js/module1.js
  - assets/js/print-report-v2.js
  - assets/js/module2.js
  - assets/js/module3.js
  - assets/js/module3-value-construction.js
  - assets/js/module-upgrades.js
  - assets/js/export-upgrades.js
  - assets/js/research-hub-v2.js
  - assets/js/content-sanitizer.js
  - assets/js/site-polish.js
  - assets/js/experience-v2.js
  - assets/js/field-studies.js
  - assets/js/field-study-integration.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
