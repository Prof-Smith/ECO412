site_name: ECO 412 | Behavioral Economics Lab
site_description: Interactive behavioral economics laboratories for ECO 412
site_author: Zachary A. Smith
site_url: https://Prof-Smith.github.io/ECO412/
repo_name: Prof-Smith/ECO412
repo_url: https://github.com/Prof-Smith/ECO412

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

